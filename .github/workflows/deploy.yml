name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate config.local.js from secrets
        run: |
          mkdir -p frontend/js
          cat > frontend/js/config.local.js << EOF
          Config.supabaseUrl = "${{ secrets.SUPABASE_URL }}";
          Config.supabaseKey = "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}";
          Config.adminEmail = "${{ secrets.ADMIN_EMAIL }}";
          EOF

      - name: Deploy via FTP
        uses: SamKirkland/ftp-action@v4
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: frontend/
          remote-dir: ${{ secrets.FTP_TARGET_DIR }}
          delete: false