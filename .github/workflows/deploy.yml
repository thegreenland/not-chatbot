name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate config.local.js from secrets
        run: |
          mkdir -p frontend/js
          cat > frontend/js/config.local.js << EOF
          Config.supabaseUrl = "${{ secrets.SUPABASE_URL }}";
          Config.supabaseKey = "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}";
          Config.adminEmail = "${{ secrets.ADMIN_EMAIL }}";
          EOF

      - name: Deploy via FTP
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          lftp -u "${{ secrets.SFTP_USERNAME }},${{ secrets.SFTP_PASSWORD }}" -p "${{ secrets.SFTP_PORT }}" "${{ secrets.SFTP_HOST }}" << EOF
          set -d
          cd "${{ secrets.SFTP_TARGET_DIR }}"
          mirror -R ./frontend ./frontend
          quit
          EOF